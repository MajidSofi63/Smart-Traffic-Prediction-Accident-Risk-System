<!DOCTYPE html>
<html>
<head>
    <title>Smart Traffic - Real Time Risk Prediction</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { margin: 0; padding: 0; font-family: Arial, sans-serif; }
        .container { display: flex; height: 100vh; }
        .sidebar {
            width: 350px;
            background: white;
            padding: 20px;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
            overflow-y: auto;
            z-index: 10;
        }
        .map-container { flex: 1; position: relative; }
        #map { height: 100%; width: 100%; }
        h2 { color: #667eea; margin-top: 0; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }
        .risk-card {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
        }
        .risk-card.show { display: block; }
        .risk-level {
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            padding: 10px;
            border-radius: 8px;
        }
        .risk-low { background: #4CAF50; color: white; }
        .risk-medium { background: #ff9800; color: white; }
        .risk-high { background: #f44336; color: white; }
        .voice-btn { background: #2196F3; margin-top: 10px; }
        .legend {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: white;
            padding: 10px;
            border-radius: 5px;
            z-index: 1000;
            font-size: 12px;
        }
        .legend-color { width: 20px; height: 20px; display: inline-block; margin-right: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h2>🚗 Smart Traffic Risk Predictor</h2>
            <p style="color: #666; font-size: 12px;">Powered by TomTom Traffic + Hugging Face AI</p>
            
            <div class="form-group">
                <label>📍 Start Point:</label>
                <input type="text" id="start" placeholder="Enter address" value="New Delhi">
            </div>
            
            <div class="form-group">
                <label>🏁 Destination:</label>
                <input type="text" id="end" placeholder="Enter address" value="Mumbai">
            </div>
            
            <div class="form-group">
                <label>📧 Email for Alerts:</label>
                <input type="email" id="email" placeholder="Your email (optional)">
            </div>
            
            <div class="form-group">
                <label>🚗 Vehicle Type:</label>
                <select id="vehicle">
                    <option value="Car">Car</option>
                    <option value="Motorcycle">Motorcycle</option>
                    <option value="Truck">Truck</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>⏰ Time of Day:</label>
                <select id="time">
                    <option value="Morning">Morning (6AM-12PM)</option>
                    <option value="Afternoon">Afternoon (12PM-5PM)</option>
                    <option value="Evening">Evening (5PM-9PM)</option>
                    <option value="Night">Night (9PM-6AM)</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>☁️ Weather:</label>
                <select id="weather">
                    <option value="Clear">Clear</option>
                    <option value="Rain">Rain</option>
                    <option value="Fog">Fog</option>
                    <option value="Snow">Snow</option>
                </select>
            </div>
            
            <button onclick="calculateRoute()">🔍 Calculate Route & Risk</button>
            <button onclick="speakRoute()" class="voice-btn">🔊 Voice Alert</button>
            
            <div id="riskCard" class="risk-card">
                <div id="riskLevel" class="risk-level"></div>
                <div id="routeInfo" style="margin: 15px 0; padding: 10px; background: #e3f2fd; border-radius: 5px;"></div>
                <div id="riskFactors"></div>
                <div id="emailStatus" style="font-size: 12px; margin-top: 10px;"></div>
            </div>
        </div>
        <div class="map-container">
            <div id="map"></div>
            <div class="legend">
                <strong>Risk Zones:</strong><br>
                <span class="legend-color" style="background: #4CAF50;"></span> Low<br>
                <span class="legend-color" style="background: #ff9800;"></span> Medium<br>
                <span class="legend-color" style="background: #f44336;"></span> High
            </div>
        </div>
    </div>

    <script>
        let map, routeLayer;
        
        function initMap() {
            map = L.map('map').setView([20.5937, 78.9629], 5);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
                attribution: '© OpenStreetMap, © TomTom'
            }).addTo(map);
        }
        
        async function calculateRoute() {
            const start = document.getElementById('start').value;
            const end = document.getElementById('end').value;
            const vehicle = document.getElementById('vehicle').value;
            const time = document.getElementById('time').value;
            const weather = document.getElementById('weather').value;
            const email = document.getElementById('email').value;
            
            if (!start || !end) {
                alert("Please enter both start and destination");
                return;
            }
            
            document.getElementById('riskCard').classList.add('show');
            document.getElementById('riskLevel').innerHTML = "🔄 Calculating...";
            
            try {
                const response = await fetch('/calculate_route', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        start: start,
                        end: end,
                        vehicle_type: vehicle,
                        time_of_day: time,
                        weather: weather,
                        user_email: email
                    })
                });
                
                const data = await response.json();
                
                if (data.error) {
                    document.getElementById('riskLevel').innerHTML = "Error";
                    alert(data.error);
                    return;
                }
                
                displayRoute(data.route.points);
                displayRisk(data.risk, data.route, data.email_sent);
                
                // Store for voice
                window.currentRisk = data.risk;
                window.currentRoute = data.route;
                
            } catch (error) {
                alert("Error: " + error.message);
            }
        }
        
        function displayRoute(points) {
            if (routeLayer) map.removeLayer(routeLayer);
            
            const latlngs = points.map(p => [p[0], p[1]]);
            routeLayer = L.polyline(latlngs, { color: '#2196F3', weight: 5 }).addTo(map);
            map.fitBounds(routeLayer.getBounds());
        }
        
        function displayRisk(risk, route, emailSent) {
            const riskClass = risk.risk_level === 'HIGH' ? 'risk-high' : (risk.risk_level === 'MEDIUM' ? 'risk-medium' : 'risk-low');
            document.getElementById('riskLevel').innerHTML = `${risk.risk_level} RISK - ${risk.severity} Accident Possible (${risk.confidence}%)`;
            document.getElementById('riskLevel').className = `risk-level ${riskClass}`;
            
            document.getElementById('routeInfo').innerHTML = `
                📍 Distance: ${route.distance_km.toFixed(0)} km<br>
                ⏱️ Duration: ${route.duration_min.toFixed(0)} minutes<br>
                🚦 Traffic Delay: ${route.traffic_delay_min.toFixed(0)} minutes
            `;
            
            let factorsHtml = "<strong>⚠️ Risk Factors:</strong><ul>";
            risk.risk_factors.forEach(f => { factorsHtml += `<li>${f}</li>`; });
            factorsHtml += "</ul>";
            document.getElementById('riskFactors').innerHTML = factorsHtml;
            
            if (emailSent) {
                document.getElementById('emailStatus').innerHTML = "✅ Alert email sent!";
            } else if (document.getElementById('email').value) {
                document.getElementById('emailStatus').innerHTML = "⚠️ Email failed - Check API keys";
            }
        }
        
        function speakRoute() {
            if (!window.currentRisk) {
                alert("Calculate a route first");
                return;
            }
            
            const risk = window.currentRisk;
            const route = window.currentRoute;
            const vehicle = document.getElementById('vehicle').value;
            
            let message = `${risk.risk_level} risk route. ${risk.severity} accident possible with ${risk.confidence} percent confidence. `;
            message += `Distance ${route.distance_km.toFixed(0)} kilometers. Duration ${route.duration_min.toFixed(0)} minutes. `;
            
            if (risk.risk_level === 'HIGH') {
                message += "High risk detected. Reduce speed and stay alert. ";
            } else if (risk.risk_level === 'MEDIUM') {
                message += "Medium risk. Exercise caution. ";
            } else {
                message += "Low risk. Safe journey. ";
            }
            
            if (vehicle === 'Motorcycle') {
                message += "Motorcycle detected. Wear protective gear. ";
            }
            
            const utterance = new SpeechSynthesisUtterance(message);
            utterance.rate = 0.9;
            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(utterance);
        }
        
        window.addEventListener('load', initMap);
    </script>
</body>
</html>
