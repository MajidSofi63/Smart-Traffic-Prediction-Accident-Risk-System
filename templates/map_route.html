<!DOCTYPE html>
<html>
<head>
    <title>Route Risk Predictor</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Leaflet core + heatmap plugin -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.heat/0.2.0/leaflet-heat.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: 'Segoe UI', Roboto, Arial, sans-serif; background: #f0f2f5; }
        .app-container { display: flex; height: 100vh; }
        /* Sidebar */
        .sidebar {
            width: 400px;
            background: white;
            padding: 20px;
            box-shadow: 2px 0 12px rgba(0,0,0,0.1);
            overflow-y: auto;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .map-container { flex: 1; position: relative; }
        #map { height: 100%; width: 100%; }
        h2 { color: #1e3a8a; margin: 0 0 8px 0; display: flex; align-items: center; gap: 8px; }
        .badge { font-size: 12px; background: #e2e8f0; padding: 2px 8px; border-radius: 20px; font-weight: normal; }
        .form-group { margin-bottom: 12px; }
        label { font-weight: 600; font-size: 13px; color: #334155; display: block; margin-bottom: 4px; }
        input, select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            font-size: 14px;
            background: white;
            transition: 0.2s;
        }
        input:focus, select:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59,130,246,0.2); }
        button {
            width: 100%;
            padding: 10px;
            background: #1e3a8a;
            border: none;
            border-radius: 40px;
            color: white;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 4px;
        }
        button:hover { background: #2563eb; transform: scale(0.98); }
        .search-btn { background: #0f172a; margin-top: 4px; }
        .voice-controls { display: flex; gap: 10px; margin: 8px 0; }
        .voice-controls button { margin: 0; flex: 1; background: #334155; }
        .voice-on { background: #15803d; }
        .voice-off { background: #b91c1c; }
        .voice-pause { background: #d97706; }
        .risk-card {
            background: #f8fafc;
            border-radius: 20px;
            padding: 16px;
            margin-top: 16px;
            border-left: 6px solid;
            display: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .risk-level {
            font-size: 24px;
            font-weight: 800;
            text-align: center;
            padding: 12px;
            border-radius: 40px;
            margin-bottom: 12px;
        }
        .risk-LOW { background: #22c55e; color: white; }
        .risk-MEDIUM { background: #f97316; color: white; }
        .risk-HIGH { background: #ef4444; color: white; }
        .route-info { background: #e6f0ff; padding: 12px; border-radius: 16px; margin: 12px 0; font-size: 14px; }
        .factors-list { padding-left: 20px; margin: 8px 0; }
        .status-bar {
            background: #eef2ff;
            padding: 8px 12px;
            border-radius: 40px;
            font-size: 12px;
            text-align: center;
            color: #1e3a8a;
        }
        .legend {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(4px);
            padding: 10px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            z-index: 1000;
        }
        .legend-color { display: inline-block; width: 18px; height: 18px; border-radius: 4px; margin-right: 6px; vertical-align: middle; }
        .instruction {
            font-size: 11px;
            background: #f1f5f9;
            padding: 10px;
            border-radius: 16px;
            text-align: center;
            color: #475569;
        }
        hr { margin: 8px 0; border-color: #e2e8f0; }
    </style>
</head>
<body>
<div class="app-container">
    <div class="sidebar">
        <h2>🚗 Route Risk Predictor </h2>
        <div class="status-bar" id="status">💡 Click map to set START, or type address</div>

        <div class="form-group">
            <label>📍 START (type or click map)</label>
            <input type="text" id="start" placeholder="e.g., Delhi">
            <button onclick="searchAddress('start')" class="search-btn">🔍 Search Start</button>
        </div>

        <div class="form-group">
            <label>🏁 DESTINATION (type or click map)</label>
            <input type="text" id="end" placeholder="e.g., Mumbai">
            <button onclick="searchAddress('end')" class="search-btn">🔍 Search Destination</button>
        </div>

        <div class="form-group">
            <label>📧 Email for alerts (optional)</label>
            <input type="email" id="email" placeholder="you@example.com">
        </div>

        <div class="form-group">
            <label>🚗 Vehicle</label>
            <select id="vehicle">
                <option value="Car">Car</option>
                <option value="Motorcycle">Motorcycle</option>
                <option value="Truck">Truck</option>
            </select>
        </div>

        <div class="form-group">
            <label>⏰ Time of day</label>
            <select id="time">
                <option value="Morning">Morning (06–12)</option>
                <option value="Afternoon">Afternoon (12–17)</option>
                <option value="Evening">Evening (17–21)</option>
                <option value="Night">Night (21–06)</option>
            </select>
        </div>

        <div class="form-group">
            <label>🌤️ Weather</label>
            <select id="weather">
                <option value="Clear">Clear</option>
                <option value="Rain">Rain</option>
                <option value="Fog">Fog</option>
                <option value="Snow">Snow</option>
            </select>
        </div>

        <button onclick="calculateRoute()">🔍 Calculate Route & Risk</button>

        <div class="voice-controls">
            <button onclick="voiceOn()" class="voice-on">🔊 ON</button>
            <button onclick="voiceOff()" class="voice-off">🔇 OFF</button>
            <button onclick="voicePause()" class="voice-pause">⏸️ Pause</button>
        </div>
        <button onclick="speakNow()" style="background:#3b82f6;">🎤 Speak current risk</button>
        <button onclick="clearAll()" style="background:#475569;">🗑️ Clear all</button>

        <div id="riskCard" class="risk-card">
            <div id="riskLevel" class="risk-level"></div>
            <div id="routeInfo" class="route-info"></div>
            <div id="riskFactors"></div>
            <div id="emailStatus" style="font-size:12px; margin-top:10px; text-align:center;"></div>
        </div>
        <div class="instruction">
            ✅ Type any address (street, landmark, city) → TomTom finds it<br>
            🔥 Heatmap: 🔴 High risk, 🟡 Medium, 🟢 Low accident zones<br>
            🔊 Voice reads risk level and distance
        </div>
    </div>
    <div class="map-container">
        <div id="map"></div>
        <div class="legend">
            <strong>🔥 Accident risk zones</strong><br>
            <span class="legend-color" style="background:#ff0000;"></span> High<br>
            <span class="legend-color" style="background:#ffaa00;"></span> Medium<br>
            <span class="legend-color" style="background:#00cc44;"></span> Low
        </div>
    </div>
</div>

<script>
    // ------------------- LEAFLET MAP -------------------
    let map, routeLayer, heatLayer, startMarker, endMarker;
    let selectingStart = true;
    let currentRouteData = null;
    let voiceEnabled = true;
    let currentUtterance = null;

    // Sample accident hotspots (intensity = risk weight)
    const HOTSPOTS = [
        [28.6139, 77.2090, 0.95], [28.6300, 77.2200, 0.92], [28.5600, 77.3200, 0.88],
        [19.0760, 72.8777, 0.90], [19.1000, 72.8500, 0.85], [12.9716, 77.5946, 0.82],
        [22.5726, 88.3639, 0.80], [28.5000, 77.3000, 0.65], [28.4000, 77.2000, 0.60],
        [13.0827, 80.2707, 0.58], [17.3850, 78.4867, 0.55], [26.9124, 75.7873, 0.52],
        [26.8000, 78.0000, 0.20], [21.0000, 75.0000, 0.15], [18.0000, 76.0000, 0.12]
    ];

    function initMap() {
        map = L.map('map').setView([20.5937, 78.9629], 5);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> | TomTom traffic'
        }).addTo(map);

        // Click on map to set start/destination
        map.on('click', function(e) {
            const lat = e.latlng.lat, lng = e.latlng.lng;
            const coordStr = `${lat.toFixed(6)}, ${lng.toFixed(6)}`;
            if (selectingStart) {
                setMarker('start', lat, lng, coordStr);
                document.getElementById('status').innerHTML = '✅ Start set. Now click map for DESTINATION or type below.';
            } else {
                setMarker('end', lat, lng, coordStr);
                document.getElementById('status').innerHTML = '✅ Destination set. Click "Calculate Route & Risk".';
            }
            selectingStart = !selectingStart;
        });

        addHeatmap();
    }

    function addHeatmap() {
        if (heatLayer) map.removeLayer(heatLayer);
        heatLayer = L.heatLayer(HOTSPOTS, {
            radius: 38,
            blur: 22,
            maxZoom: 12,
            minOpacity: 0.35,
            gradient: { 0.2: '#00cc44', 0.5: '#ffaa00', 0.9: '#ff0000' }
        }).addTo(map);
    }

    function setMarker(type, lat, lng, label) {
        const marker = (type === 'start') ? startMarker : endMarker;
        if (marker) map.removeLayer(marker);
        const newMarker = L.marker([lat, lng]).addTo(map);
        newMarker.bindPopup(type === 'start' ? '📍 Start' : '🏁 Destination').openPopup();
        if (type === 'start') {
            startMarker = newMarker;
            document.getElementById('start').value = label;
        } else {
            endMarker = newMarker;
            document.getElementById('end').value = label;
        }
    }

    // ------------------- ADDRESS SEARCH (backend TomTom) -------------------
    async function searchAddress(pointType) {
        const address = document.getElementById(pointType).value.trim();
        if (!address) { alert("Please enter an address"); return; }
        document.getElementById('status').innerHTML = '🔍 Searching with TomTom...';
        try {
            // Use backend geocoding endpoint (TomTom)
            const response = await fetch('/geocode', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ address: address })
            });
            const data = await response.json();
            if (data.error) throw new Error(data.error);
            setMarker(pointType, data.lat, data.lon, address);
            if (pointType === 'start') selectingStart = false;
            else selectingStart = true;
            document.getElementById('status').innerHTML = `✅ ${pointType === 'start' ? 'Start' : 'Destination'} located!`;
        } catch (err) {
            alert("Address not found. Try a landmark or city name.");
            console.error(err);
        }
    }

    // ------------------- ROUTE + RISK -------------------
    async function calculateRoute() {
        const start = document.getElementById('start').value;
        const end = document.getElementById('end').value;
        if (!start || !end) { alert("Please set both start and destination"); return; }

        const card = document.getElementById('riskCard');
        card.style.display = 'block';
        document.getElementById('riskLevel').innerHTML = "🔄 Calculating route with live traffic...";

        const payload = {
            start: start,
            end: end,
            vehicle: document.getElementById('vehicle').value,
            time: document.getElementById('time').value,
            weather: document.getElementById('weather').value,
            email: document.getElementById('email').value
        };

        try {
            const resp = await fetch('/api/route', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await resp.json();
            if (data.error) throw new Error(data.error);

            const route = data.route;
            const risk = data.risk;
            currentRouteData = { distance: route.distance_km, duration: route.duration_min, risk };

            // Draw route on map
            if (routeLayer) map.removeLayer(routeLayer);
            routeLayer = L.polyline(route.points, { color: '#2563eb', weight: 5, opacity: 0.8 }).addTo(map);
            map.fitBounds(routeLayer.getBounds());

            // Refresh heatmap overlay
            addHeatmap();

            // Update UI
            document.getElementById('riskLevel').innerHTML = `${risk.level} RISK (Score ${risk.score}/100)`;
            document.getElementById('riskLevel').className = `risk-level risk-${risk.level}`;
            document.getElementById('routeInfo').innerHTML = `
                📍 Distance: ${route.distance_km.toFixed(0)} km &nbsp;|&nbsp;
                ⏱️ Duration: ${route.duration_min.toFixed(0)} min<br>
                🚦 Live traffic delay: ${route.traffic_delay_min.toFixed(0)} min
            `;
            let factorsHtml = "<strong>⚠️ Risk factors</strong><ul class='factors-list'>";
            risk.factors.forEach(f => factorsHtml += `<li>${f}</li>`);
            factorsHtml += "</ul>";
            document.getElementById('riskFactors').innerHTML = factorsHtml;
            if (data.email_sent) document.getElementById('emailStatus').innerHTML = "✅ Alert email sent!";
            else if (payload.email) document.getElementById('emailStatus').innerHTML = "⚠️ Email not sent (API key missing)";

            // Voice announcement if enabled
            if (voiceEnabled) {
                let msg = `${risk.level} risk route. ${route.distance_km.toFixed(0)} kilometers, ${route.duration_min.toFixed(0)} minutes.`;
                if (risk.level === 'HIGH') msg = "Warning! " + msg + " Drive with extreme caution.";
                speakMessage(msg);
            }
        } catch (err) {
            document.getElementById('riskLevel').innerHTML = `❌ Error: ${err.message}`;
        }
    }

    // ------------------- VOICE HELPERS -------------------
    function speakMessage(msg) {
        if (!voiceEnabled) return;
        if (currentUtterance) window.speechSynthesis.cancel();
        currentUtterance = new SpeechSynthesisUtterance(msg);
        currentUtterance.rate = 0.9;
        currentUtterance.onend = () => { currentUtterance = null; };
        window.speechSynthesis.speak(currentUtterance);
    }

    function voiceOn() { voiceEnabled = true; speakMessage("Voice alerts on"); document.getElementById('status').innerHTML = "🔊 Voice ON"; }
    function voiceOff() { voiceEnabled = false; if (currentUtterance) window.speechSynthesis.cancel(); document.getElementById('status').innerHTML = "🔇 Voice OFF"; }
    function voicePause() { if (window.speechSynthesis.speaking) window.speechSynthesis.cancel(); }
    function speakNow() {
        if (!currentRouteData) speakMessage("Please calculate a route first.");
        else speakMessage(`${currentRouteData.risk.level} risk route. ${currentRouteData.distance.toFixed(0)} kilometers, ${currentRouteData.duration.toFixed(0)} minutes.`);
    }

    // ------------------- RESET -------------------
    function clearAll() {
        if (startMarker) map.removeLayer(startMarker);
        if (endMarker) map.removeLayer(endMarker);
        if (routeLayer) map.removeLayer(routeLayer);
        startMarker = endMarker = routeLayer = null;
        selectingStart = true;
        currentRouteData = null;
        document.getElementById('start').value = '';
        document.getElementById('end').value = '';
        document.getElementById('riskCard').style.display = 'none';
        document.getElementById('status').innerHTML = '💡 Click map to set START or type address';
        map.setView([20.5937, 78.9629], 5);
        addHeatmap();
    }

    window.addEventListener('load', initMap);
</script>
</body>
</html>
