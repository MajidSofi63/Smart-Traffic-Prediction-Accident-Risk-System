<!DOCTYPE html>
<html>
<head>
    <title>Smart Traffic - Risk Prediction</title>
    <meta charset="utf-8">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { margin: 0; padding: 0; font-family: Arial, sans-serif; }
        .container { display: flex; height: 100vh; }
        .sidebar {
            width: 350px;
            background: white;
            padding: 20px;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
            overflow-y: auto;
        }
        .map-container { flex: 1; }
        #map { height: 100%; width: 100%; }
        h2 { color: #667eea; margin-top: 0; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }
        .risk-card {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
        }
        .risk-card.show { display: block; }
        .risk-level {
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            padding: 10px;
            border-radius: 8px;
        }
        .risk-low { background: #4CAF50; color: white; }
        .risk-medium { background: #ff9800; color: white; }
        .risk-high { background: #f44336; color: white; }
        .legend {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: white;
            padding: 10px;
            border-radius: 5px;
            font-size: 12px;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h2>🚗 Risk Predictor</h2>
            
            <div class="form-group">
                <label>📍 Start:</label>
                <input type="text" id="start" placeholder="e.g., New Delhi" value="New Delhi">
            </div>
            
            <div class="form-group">
                <label>🏁 Destination:</label>
                <input type="text" id="end" placeholder="e.g., Mumbai" value="Mumbai">
            </div>
            
            <div class="form-group">
                <label>📧 Email (for alerts):</label>
                <input type="email" id="email" placeholder="your@email.com">
            </div>
            
            <div class="form-group">
                <label>🚗 Vehicle:</label>
                <select id="vehicle">
                    <option value="Car">Car</option>
                    <option value="Motorcycle">Motorcycle</option>
                    <option value="Truck">Truck</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>⏰ Time:</label>
                <select id="time">
                    <option value="Morning">Morning</option>
                    <option value="Afternoon">Afternoon</option>
                    <option value="Evening">Evening</option>
                    <option value="Night">Night</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>☁️ Weather:</label>
                <select id="weather">
                    <option value="Clear">Clear</option>
                    <option value="Rain">Rain</option>
                    <option value="Fog">Fog</option>
                </select>
            </div>
            
            <button onclick="calculateRoute()">🔍 Calculate Risk</button>
            
            <div id="riskCard" class="risk-card">
                <div id="riskLevel" class="risk-level"></div>
                <div id="routeInfo" style="margin: 10px 0;"></div>
                <div id="riskFactors"></div>
                <div id="emailStatus" style="font-size: 12px; margin-top: 10px;"></div>
            </div>
        </div>
        <div class="map-container">
            <div id="map"></div>
            <div class="legend">
                <span style="background:#4CAF50; display:inline-block; width:12px; height:12px;"></span> Low
                <span style="background:#ff9800; display:inline-block; width:12px; height:12px; margin-left:5px;"></span> Medium
                <span style="background:#f44336; display:inline-block; width:12px; height:12px; margin-left:5px;"></span> High
            </div>
        </div>
    </div>

    <script>
        let map, routeLayer;
        
        function initMap() {
            map = L.map('map').setView([20.5937, 78.9629], 5);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap'
            }).addTo(map);
        }
        
        async function calculateRoute() {
            const start = document.getElementById('start').value;
            const end = document.getElementById('end').value;
            const vehicle = document.getElementById('vehicle').value;
            const time = document.getElementById('time').value;
            const weather = document.getElementById('weather').value;
            const email = document.getElementById('email').value;
            
            if (!start || !end) {
                alert("Please enter start and destination");
                return;
            }
            
            document.getElementById('riskCard').classList.add('show');
            document.getElementById('riskLevel').innerHTML = "🔄 Calculating...";
            
            try {
                const response = await fetch('/calculate_route', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        start: start,
                        end: end,
                        vehicle_type: vehicle,
                        time_of_day: time,
                        weather: weather,
                        user_email: email
                    })
                });
                
                const data = await response.json();
                
                if (data.error) {
                    document.getElementById('riskLevel').innerHTML = "Error";
                    alert("Error: " + data.error);
                    return;
                }
                
                // Display route on map
                if (routeLayer) map.removeLayer(routeLayer);
                const points = data.route.points.map(p => [p[0], p[1]]);
                routeLayer = L.polyline(points, { color: '#2196F3', weight: 5 }).addTo(map);
                map.fitBounds(routeLayer.getBounds());
                
                // Display risk assessment
                const risk = data.risk;
                const riskClass = risk.risk_level === 'HIGH' ? 'risk-high' : (risk.risk_level === 'MEDIUM' ? 'risk-medium' : 'risk-low');
                document.getElementById('riskLevel').innerHTML = `${risk.risk_level} RISK - ${risk.severity} (${risk.confidence}%)`;
                document.getElementById('riskLevel').className = `risk-level ${riskClass}`;
                
                document.getElementById('routeInfo').innerHTML = `
                    📍 Distance: ${data.route.distance_km.toFixed(0)} km<br>
                    ⏱️ Duration: ${data.route.duration_min.toFixed(0)} minutes
                `;
                
                let factorsHtml = "<strong>⚠️ Risk Factors:</strong><ul>";
                risk.risk_factors.forEach(f => { factorsHtml += `<li>${f}</li>`; });
                factorsHtml += "</ul>";
                document.getElementById('riskFactors').innerHTML = factorsHtml;
                
                if (data.email_sent) {
                    document.getElementById('emailStatus').innerHTML = "✅ Alert email sent!";
                } else if (email) {
                    document.getElementById('emailStatus').innerHTML = "⚠️ Email not sent (API key missing)";
                }
                
            } catch (error) {
                document.getElementById('riskLevel').innerHTML = "Error";
                alert("Error: " + error.message);
            }
        }
        
        window.addEventListener('load', initMap);
    </script>
</body>
</html>
