<!DOCTYPE html>
<html>
<head>
    <title>Route Risk Predictor – Live Traffic & Weather</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.heat/0.2.0/leaflet-heat.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: 'Segoe UI', Roboto, Arial, sans-serif; background: #f0f2f5; }
        .app-container { display: flex; height: 100vh; }
        .sidebar {
            width: 420px;
            background: white;
            padding: 20px;
            box-shadow: 2px 0 12px rgba(0,0,0,0.1);
            overflow-y: auto;
            z-index: 10;
        }
        .map-container { flex: 1; position: relative; }
        #map { height: 100%; width: 100%; }
        h2 { color: #1e3a8a; margin: 0 0 8px 0; }
        .form-group { margin-bottom: 12px; }
        label { font-weight: 600; font-size: 13px; color: #334155; display: block; margin-bottom: 4px; }
        input, select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            font-size: 14px;
            background: white;
        }
        button {
            width: 100%;
            padding: 10px;
            background: #1e3a8a;
            border: none;
            border-radius: 40px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            margin-top: 6px;
        }
        .search-btn { background: #0f172a; margin-top: 4px; }
        .voice-controls { display: flex; gap: 10px; margin: 8px 0; }
        .voice-controls button { margin: 0; flex: 1; background: #334155; }
        .voice-on { background: #15803d; }
        .voice-off { background: #b91c1c; }
        .voice-pause { background: #d97706; }
        .risk-card, .weather-card, .history-panel {
            background: #f8fafc;
            border-radius: 20px;
            padding: 16px;
            margin-top: 16px;
            border-left: 6px solid;
            display: none;
        }
        .risk-level {
            font-size: 24px;
            font-weight: 800;
            text-align: center;
            padding: 12px;
            border-radius: 40px;
        }
        .risk-LOW { background: #22c55e; color: white; }
        .risk-MEDIUM { background: #f97316; color: white; }
        .risk-HIGH { background: #ef4444; color: white; }
        .route-info, .weather-info { background: #e6f0ff; padding: 12px; border-radius: 16px; margin: 12px 0; font-size: 14px; }
        .status-bar {
            background: #eef2ff;
            padding: 8px 12px;
            border-radius: 40px;
            font-size: 12px;
            text-align: center;
        }
        .legend {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(255,255,255,0.9);
            padding: 10px 14px;
            border-radius: 20px;
            font-size: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            z-index: 1000;
        }
        .legend-color { display: inline-block; width: 18px; height: 18px; border-radius: 4px; margin-right: 6px; vertical-align: middle; }
        .history-list { max-height: 200px; overflow-y: auto; margin-top: 8px; }
        .history-item { border-bottom: 1px solid #ddd; padding: 8px; cursor: pointer; }
        .history-item:hover { background: #e2e8f0; }
    </style>
</head>
<body>
<div class="app-container">
    <div class="sidebar">
        <h2>🚗 Route Risk Predictor</h2>
        <div class="status-bar" id="status">💡 Type or click map to set START</div>

        <div class="form-group">
            <label>📍 START (type or click map)</label>
            <input type="text" id="start" placeholder="e.g., Connaught Place, Delhi" autocomplete="off">
            <button onclick="searchAddress('start')" class="search-btn">🔍 Search Start</button>
        </div>
        <div class="form-group">
            <label>🏁 DESTINATION (type or click map)</label>
            <input type="text" id="end" placeholder="e.g., Marine Drive, Mumbai" autocomplete="off">
            <button onclick="searchAddress('end')" class="search-btn">🔍 Search Destination</button>
        </div>

        <div class="form-group">
            <label>📧 Email for alerts (optional)</label>
            <input type="email" id="email" placeholder="you@example.com">
        </div>
        <div class="form-group">
            <label>🚗 Vehicle</label>
            <select id="vehicle">
                <option>Car</option><option>Motorcycle</option><option>Truck</option>
            </select>
        </div>
        <div class="form-group">
            <label>⏰ Time of day</label>
            <select id="time">
                <option>Morning</option><option>Afternoon</option><option>Evening</option><option>Night</option>
            </select>
        </div>
        <div class="form-group">
            <label>🌤️ Weather (manual override for risk)</label>
            <select id="weather">
                <option>Clear</option><option>Rain</option><option>Fog</option><option>Snow</option>
            </select>
        </div>

        <button onclick="getUserLocation()" style="background:#10b981;">📍 Use My Live Location</button>
        <button onclick="calculateRoute()">🔍 Calculate Route & Risk</button>

        <div class="voice-controls">
            <button onclick="voiceOn()" class="voice-on">🔊 ON</button>
            <button onclick="voiceOff()" class="voice-off">🔇 OFF</button>
            <button onclick="voicePause()" class="voice-pause">⏸️ Pause</button>
        </div>
        <button onclick="speakNow()" style="background:#3b82f6;">🎤 Speak current risk</button>
        <button onclick="clearAll()" style="background:#475569;">🗑️ Clear all</button>
        <button onclick="showHistory()" style="background:#6b7280;">📜 View Trip History</button>
        <button onclick="clearHistory()" style="background:#dc2626; font-size:12px;">🗑️ Clear History</button>

        <div id="historyPanel" class="history-panel">
            <strong>📜 Past Trips</strong>
            <div id="historyList" class="history-list"></div>
        </div>

        <div id="riskCard" class="risk-card">
            <div id="riskLevel" class="risk-level"></div>
            <div id="routeInfo" class="route-info"></div>
            <div id="riskFactors"></div>
            <div id="emailStatus" style="font-size:12px; margin-top:10px; text-align:center;"></div>
        </div>

        <div id="weatherCard" class="weather-card">
            <strong>🌤️ Live Weather Along Route</strong>
            <div id="weatherInfo" class="weather-info"></div>
        </div>

        <div class="instruction">
            ✅ Live location, live weather, trip history & address autocomplete (safe backend)
        </div>
    </div>
    <div class="map-container">
        <div id="map"></div>
        <div class="legend">
            <strong>🔥 Accident risk zones</strong><br>
            <span class="legend-color" style="background:#ff0000;"></span> High<br>
            <span class="legend-color" style="background:#ffaa00;"></span> Medium<br>
            <span class="legend-color" style="background:#00cc44;"></span> Low
        </div>
    </div>
</div>

<script>
    // ------------------- GLOBAL VARIABLES -------------------
    let map, routeLayer, heatLayer, startMarker, endMarker;
    let selectingStart = true;
    let currentRouteData = null;
    let voiceEnabled = true;
    let currentUtterance = null;

    // Accident hotspots (lat, lon, intensity)
    const HOTSPOTS = [
        [28.6139, 77.2090, 0.95], [28.6300, 77.2200, 0.92], [28.5600, 77.3200, 0.88],
        [19.0760, 72.8777, 0.90], [19.1000, 72.8500, 0.85], [12.9716, 77.5946, 0.82],
        [22.5726, 88.3639, 0.80], [28.5000, 77.3000, 0.65], [28.4000, 77.2000, 0.60],
        [13.0827, 80.2707, 0.58], [17.3850, 78.4867, 0.55], [26.9124, 75.7873, 0.52],
        [26.8000, 78.0000, 0.20], [21.0000, 75.0000, 0.15], [18.0000, 76.0000, 0.12]
    ];

    function initMap() {
        map = L.map('map').setView([20.5937, 78.9629], 5);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '© OpenStreetMap | TomTom traffic'
        }).addTo(map);
        map.on('click', function(e) {
            const lat = e.latlng.lat, lng = e.latlng.lng;
            const coord = `${lat.toFixed(6)}, ${lng.toFixed(6)}`;
            if (selectingStart) {
                setMarker('start', lat, lng, coord);
                document.getElementById('status').innerHTML = '✅ Start set. Now click map for DESTINATION or type.';
            } else {
                setMarker('end', lat, lng, coord);
                document.getElementById('status').innerHTML = '✅ Destination set. Click "Calculate Route & Risk".';
            }
            selectingStart = !selectingStart;
        });
        addHeatmap();
        setupAutocomplete();   // safe autocomplete using backend proxy
    }

    function addHeatmap() {
        if (heatLayer) map.removeLayer(heatLayer);
        heatLayer = L.heatLayer(HOTSPOTS, {
            radius: 38, blur: 22, maxZoom: 12, minOpacity: 0.35,
            gradient: { 0.2: '#00cc44', 0.5: '#ffaa00', 0.9: '#ff0000' }
        }).addTo(map);
    }

    function setMarker(type, lat, lng, label) {
        const marker = (type === 'start') ? startMarker : endMarker;
        if (marker) map.removeLayer(marker);
        const newMarker = L.marker([lat, lng]).addTo(map);
        newMarker.bindPopup(type === 'start' ? '📍 Start' : '🏁 Destination').openPopup();
        if (type === 'start') {
            startMarker = newMarker;
            document.getElementById('start').value = label;
        } else {
            endMarker = newMarker;
            document.getElementById('end').value = label;
        }
    }

    // ------------------- SAFE AUTOCOMPLETE (backend proxy) -------------------
    function setupAutocomplete() {
        const startInput = document.getElementById('start');
        const endInput = document.getElementById('end');
        let timeoutId = null;

        function attach(input, pointType) {
            input.addEventListener('input', function() {
                const query = this.value.trim();
                if (query.length < 2) return;
                if (timeoutId) clearTimeout(timeoutId);
                timeoutId = setTimeout(async () => {
                    try {
                        const res = await fetch(`/autocomplete?query=${encodeURIComponent(query)}`);
                        const suggestions = await res.json();
                        if (!suggestions.length) return;
                        const datalistId = `${pointType}-datalist`;
                        let datalist = document.getElementById(datalistId);
                        if (!datalist) {
                            datalist = document.createElement('datalist');
                            datalist.id = datalistId;
                            input.setAttribute('list', datalistId);
                            input.parentNode.appendChild(datalist);
                        }
                        datalist.innerHTML = suggestions.map(s => `<option value="${s.display.replace(/"/g, '&quot;')}">`).join('');
                    } catch(err) { console.error(err); }
                }, 300);
            });

            input.addEventListener('change', async function() {
                const value = this.value;
                if (!value) return;
                const res = await fetch('/geocode', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ address: value })
                });
                const data = await res.json();
                if (data.error) return;
                setMarker(pointType, data.lat, data.lon, value);
                if (pointType === 'start') selectingStart = false;
                else selectingStart = true;
            });
        }
        attach(startInput, 'start');
        attach(endInput, 'end');
    }

    // ------------------- LIVE LOCATION -------------------
    function getUserLocation() {
        if (!navigator.geolocation) { alert("Geolocation not supported"); return; }
        document.getElementById('status').innerHTML = "📍 Getting your location...";
        navigator.geolocation.getCurrentPosition(
            (pos) => {
                const lat = pos.coords.latitude, lng = pos.coords.longitude;
                setMarker('start', lat, lng, `${lat.toFixed(6)}, ${lng.toFixed(6)}`);
                selectingStart = false;
                document.getElementById('status').innerHTML = "✅ Live location set as START! Now set destination.";
                map.setView([lat, lng], 12);
            },
            (err) => { alert("Location error: " + err.message); }
        );
    }

    // ------------------- ADDRESS SEARCH (backend geocode) -------------------
    async function searchAddress(pointType) {
        const addr = document.getElementById(pointType).value.trim();
        if (!addr) { alert("Enter an address"); return; }
        document.getElementById('status').innerHTML = '🔍 Searching...';
        try {
            const resp = await fetch('/geocode', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ address: addr })
            });
            const data = await resp.json();
            if (data.error) throw new Error(data.error);
            setMarker(pointType, data.lat, data.lon, addr);
            if (pointType === 'start') selectingStart = false;
            else selectingStart = true;
            document.getElementById('status').innerHTML = `✅ ${pointType} found!`;
        } catch (err) {
            alert("Address not found. Try landmark or city.");
        }
    }

    // ------------------- TRIP HISTORY (localStorage) -------------------
    function saveTripToHistory(start, end, riskLevel, score, distance, duration) {
        let history = JSON.parse(localStorage.getItem('tripHistory') || '[]');
        history.unshift({
            id: Date.now(),
            start, end,
            risk: riskLevel,
            score,
            distance: distance.toFixed(0),
            duration: duration.toFixed(0),
            date: new Date().toLocaleString()
        });
        if (history.length > 20) history.pop();
        localStorage.setItem('tripHistory', JSON.stringify(history));
    }

    function showHistory() {
        const panel = document.getElementById('historyPanel');
        const historyDiv = document.getElementById('historyList');
        let history = JSON.parse(localStorage.getItem('tripHistory') || '[]');
        if (history.length === 0) {
            historyDiv.innerHTML = "<i>No trips saved yet.</i>";
        } else {
            historyDiv.innerHTML = history.map(t => `
                <div class="history-item" onclick="restoreTrip('${t.start.replace(/'/g, "\\'")}', '${t.end.replace(/'/g, "\\'")}')">
                    <strong>${t.start} → ${t.end}</strong><br>
                    Risk: ${t.risk} (${t.score}/100) | ${t.distance} km | ${t.duration} min<br>
                    <small>${t.date}</small>
                </div>
            `).join('');
        }
        panel.style.display = 'block';
    }

    function restoreTrip(start, end) {
        document.getElementById('start').value = start;
        document.getElementById('end').value = end;
        document.getElementById('historyPanel').style.display = 'none';
        calculateRoute();
    }

    function clearHistory() {
        if (confirm("Delete all trip history?")) {
            localStorage.removeItem('tripHistory');
            document.getElementById('historyList').innerHTML = "";
            document.getElementById('historyPanel').style.display = 'none';
        }
    }

    // ------------------- ROUTE + RISK + WEATHER -------------------
    async function calculateRoute() {
        const start = document.getElementById('start').value;
        const end = document.getElementById('end').value;
        if (!start || !end) { alert("Set both start and destination"); return; }

        document.getElementById('riskCard').style.display = 'block';
        document.getElementById('riskLevel').innerHTML = "🔄 Calculating...";

        const payload = {
            start, end,
            vehicle: document.getElementById('vehicle').value,
            time: document.getElementById('time').value,
            weather: document.getElementById('weather').value,
            email: document.getElementById('email').value
        };

        try {
            const resp = await fetch('/api/route', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await resp.json();
            if (data.error) throw new Error(data.error);

            const route = data.route;
            const risk = data.risk;
            currentRouteData = { distance: route.distance_km, duration: route.duration_min, risk };

            if (routeLayer) map.removeLayer(routeLayer);
            routeLayer = L.polyline(route.points, { color: '#2563eb', weight: 5 }).addTo(map);
            map.fitBounds(routeLayer.getBounds());
            addHeatmap();

            document.getElementById('riskLevel').innerHTML = `${risk.level} RISK (Score ${risk.score}/100)`;
            document.getElementById('riskLevel').className = `risk-level risk-${risk.level}`;
            document.getElementById('routeInfo').innerHTML = `
                📍 ${route.distance_km.toFixed(0)} km &nbsp;|&nbsp;
                ⏱️ ${route.duration_min.toFixed(0)} min<br>
                🚦 Traffic delay: ${route.traffic_delay_min.toFixed(0)} min
            `;
            let factorsHtml = "<strong>⚠️ Risk factors</strong><ul>";
            risk.factors.forEach(f => factorsHtml += `<li>${f}</li>`);
            factorsHtml += "</ul>";
            document.getElementById('riskFactors').innerHTML = factorsHtml;
            if (data.email_sent) document.getElementById('emailStatus').innerHTML = "✅ Email sent!";

            if (data.weather_start && data.weather_end) {
                document.getElementById('weatherCard').style.display = 'block';
                document.getElementById('weatherInfo').innerHTML = `
                    Start: ${data.weather_start.desc}, ${data.weather_start.temp}°C, wind ${data.weather_start.wind} km/h<br>
                    Destination: ${data.weather_end.desc}, ${data.weather_end.temp}°C, wind ${data.weather_end.wind} km/h
                `;
            }

            saveTripToHistory(start, end, risk.level, risk.score, route.distance_km, route.duration_min);

            if (voiceEnabled) {
                let msg = `${risk.level} risk. ${route.distance_km.toFixed(0)} km, ${route.duration_min.toFixed(0)} min.`;
                if (risk.level === 'HIGH') msg = "Warning! " + msg;
                speakMessage(msg);
            }
        } catch (err) {
            document.getElementById('riskLevel').innerHTML = `❌ Error: ${err.message}`;
        }
    }

    // ------------------- VOICE -------------------
    function speakMessage(msg) {
        if (!voiceEnabled) return;
        if (currentUtterance) window.speechSynthesis.cancel();
        currentUtterance = new SpeechSynthesisUtterance(msg);
        currentUtterance.rate = 0.9;
        currentUtterance.onend = () => { currentUtterance = null; };
        window.speechSynthesis.speak(currentUtterance);
    }
    function voiceOn() { voiceEnabled = true; speakMessage("Voice on"); document.getElementById('status').innerHTML = "🔊 Voice ON"; }
    function voiceOff() { voiceEnabled = false; if (currentUtterance) window.speechSynthesis.cancel(); document.getElementById('status').innerHTML = "🔇 Voice OFF"; }
    function voicePause() { if (window.speechSynthesis.speaking) window.speechSynthesis.cancel(); }
    function speakNow() {
        if (!currentRouteData) speakMessage("Calculate a route first.");
        else speakMessage(`${currentRouteData.risk.level} risk. ${currentRouteData.distance.toFixed(0)} km, ${currentRouteData.duration.toFixed(0)} min.`);
    }

    // ------------------- RESET -------------------
    function clearAll() {
        if (startMarker) map.removeLayer(startMarker);
        if (endMarker) map.removeLayer(endMarker);
        if (routeLayer) map.removeLayer(routeLayer);
        startMarker = endMarker = routeLayer = null;
        selectingStart = true;
        currentRouteData = null;
        document.getElementById('start').value = '';
        document.getElementById('end').value = '';
        document.getElementById('riskCard').style.display = 'none';
        document.getElementById('weatherCard').style.display = 'none';
        document.getElementById('historyPanel').style.display = 'none';
        document.getElementById('status').innerHTML = '💡 Type or click map to set START';
        map.setView([20.5937, 78.9629], 5);
        addHeatmap();
    }

    window.addEventListener('load', initMap);
</script>
</body>
</html>
