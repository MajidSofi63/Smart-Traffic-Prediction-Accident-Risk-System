<!DOCTYPE html>
<html>
<head>
    <title>Route Risk Predictor – Live Traffic & Weather</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <!-- Leaflet (no zoom control, no attribution) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.heat/0.2.0/leaflet-heat.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.marker-motion@0.7.0/leaflet.marker-motion.css" />
    <script src="https://cdn.jsdelivr.net/npm/leaflet.marker-motion@0.7.0/leaflet.marker-motion.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Segoe UI',Roboto,sans-serif; background:#f0f2f5; overflow:hidden; height:100vh; }
        .app-container { display:flex; height:100%; width:100%; }
        /* Desktop sidebar */
        .sidebar {
            width:420px;
            background:white;
            padding:20px;
            box-shadow:2px 0 12px rgba(0,0,0,0.1);
            overflow-y:auto;
            z-index:10;
        }
        .map-container { flex:1; position:relative; }
        #map { height:100%; width:100%; }
        /* Mobile hamburger button (left side) */
        .hamburger {
            display:none;
            position:fixed;
            top:16px;
            left:16px;
            z-index:1000;
            background:white;
            border:none;
            font-size:28px;
            cursor:pointer;
            border-radius:12px;
            padding:8px 12px;
            box-shadow:0 2px 8px rgba(0,0,0,0.2);
            color:#1e3a8a;
        }
        /* Mobile overlay sidebar */
        .sidebar-mobile {
            position:fixed;
            top:0;
            left:0;
            width:85%;
            max-width:360px;
            height:100%;
            background:white;
            z-index:1001;
            transform:translateX(-100%);
            transition:transform 0.3s ease;
            overflow-y:auto;
            padding:20px;
            box-shadow:2px 0 12px rgba(0,0,0,0.2);
        }
        .sidebar-mobile.open { transform:translateX(0); }
        .overlay {
            display:none;
            position:fixed;
            top:0; left:0; right:0; bottom:0;
            background:rgba(0,0,0,0.5);
            z-index:1000;
        }
        .close-btn {
            background:none;
            border:none;
            font-size:24px;
            float:right;
            cursor:pointer;
            color:#666;
        }
        @media (max-width:767px) {
            .sidebar { display:none; }
            .hamburger { display:block; }
        }
        @media (min-width:768px) {
            .sidebar-mobile, .overlay, .close-btn { display:none; }
        }
        /* Form styles */
        h2 { color:#1e3a8a; margin-top:0; }
        .form-group { margin-bottom:15px; }
        label { font-weight:600; font-size:13px; color:#334155; display:block; margin-bottom:4px; }
        input, select {
            width:100%;
            padding:10px 12px;
            border:1px solid #cbd5e1;
            border-radius:12px;
            font-size:14px;
            background:white;
        }
        button {
            width:100%;
            padding:10px;
            background:#1e3a8a;
            border:none;
            border-radius:40px;
            color:white;
            font-weight:bold;
            cursor:pointer;
            margin-top:6px;
        }
        .search-btn { background:#0f172a; }
        .voice-controls { display:flex; gap:10px; margin:8px 0; }
        .voice-controls button { margin:0; flex:1; background:#334155; }
        .voice-on { background:#15803d; }
        .voice-off { background:#b91c1c; }
        .voice-pause { background:#d97706; }
        .risk-card, .weather-card, .history-panel {
            background:#f8fafc;
            border-radius:20px;
            padding:16px;
            margin-top:16px;
            border-left:6px solid;
            display:none;
        }
        .risk-level {
            font-size:24px;
            font-weight:800;
            text-align:center;
            padding:12px;
            border-radius:40px;
        }
        .risk-LOW { background:#22c55e; color:white; }
        .risk-MEDIUM { background:#f97316; color:white; }
        .risk-HIGH { background:#ef4444; color:white; }
        .route-info, .weather-info { background:#e6f0ff; padding:12px; border-radius:16px; margin:12px 0; font-size:14px; }
        .status-bar {
            background:#eef2ff;
            padding:8px 12px;
            border-radius:40px;
            font-size:12px;
            text-align:center;
            margin-bottom:12px;
        }
        .history-list { max-height:200px; overflow-y:auto; margin-top:8px; }
        .history-item { border-bottom:1px solid #ddd; padding:8px; cursor:pointer; }
        .history-item:hover { background:#e2e8f0; }
        .instruction { font-size:11px; background:#f1f5f9; padding:10px; border-radius:16px; text-align:center; margin-top:12px; color:#475569; }
        .journey-controls { display:flex; gap:8px; margin:10px 0; }
    </style>
</head>
<body>
<div class="app-container">
    <!-- Desktop sidebar -->
    <div class="sidebar" id="desktopSidebar">
        <h2>🚗 Route Risk Predictor</h2>
        <div class="status-bar" id="status">💡 Type or click map to set START</div>
        <div class="form-group">
            <label>📍 START (type or click map)</label>
            <input type="text" id="start" placeholder="e.g., Connaught Place, Delhi" autocomplete="off">
            <button onclick="searchAddressDesktop('start')" class="search-btn">🔍 Search Start</button>
        </div>
        <div class="form-group">
            <label>🏁 DESTINATION (type or click map)</label>
            <input type="text" id="end" placeholder="e.g., Marine Drive, Mumbai" autocomplete="off">
            <button onclick="searchAddressDesktop('end')" class="search-btn">🔍 Search Destination</button>
        </div>
        <div class="form-group"><label>📧 Email (optional)</label><input type="email" id="email" placeholder="you@example.com"></div>
        <div class="form-group"><label>🚗 Vehicle</label><select id="vehicle"><option>Car</option><option>Motorcycle</option><option>Truck</option></select></div>
        <div class="form-group"><label>⏰ Time of day</label><select id="time"><option>Morning</option><option>Afternoon</option><option>Evening</option><option>Night</option></select></div>
        <div class="form-group"><label>🌤️ Weather</label><select id="weather"><option>Clear</option><option>Rain</option><option>Fog</option><option>Snow</option></select></div>
        <button onclick="getUserLocationDesktop()" style="background:#10b981;">📍 Use My Live Location</button>
        <button onclick="calculateRouteDesktop()">🔍 Calculate Route & Risk</button>
        <div id="journeyControls" class="journey-controls" style="display:none;"><button id="startJourneyBtn">▶️ Start</button><button id="pauseJourneyBtn">⏸️ Pause</button><button id="resetJourneyBtn">🔄 Reset</button></div>
        <div class="voice-controls"><button onclick="voiceOnDesktop()" class="voice-on">🔊 ON</button><button onclick="voiceOffDesktop()" class="voice-off">🔇 OFF</button><button onclick="voicePauseDesktop()" class="voice-pause">⏸️ Pause</button></div>
        <button onclick="speakNowDesktop()" style="background:#3b82f6;">🎤 Speak current risk</button>
        <button onclick="clearAllDesktop()" style="background:#475569;">🗑️ Clear all</button>
        <button onclick="showHistoryDesktop()" style="background:#6b7280;">📜 View Trip History</button>
        <button onclick="clearHistoryDesktop()" style="background:#dc2626; font-size:12px;">🗑️ Clear History</button>
        <div id="historyPanel" class="history-panel"><strong>📜 Past Trips</strong><div id="historyList" class="history-list"></div></div>
        <div id="riskCard" class="risk-card"><div id="riskLevel" class="risk-level"></div><div id="routeInfo" class="route-info"></div><div id="riskFactors"></div><div id="emailStatus" style="font-size:12px;margin-top:10px;text-align:center;"></div></div>
        <div id="weatherCard" class="weather-card"><strong>🌤️ Live Weather</strong><div id="weatherInfo" class="weather-info"></div></div>
        <div class="instruction">✅ Live location • Live weather • Trip history • Autocomplete<br>🚗 After route, use "Start Journey" for moving marker.</div>
    </div>

    <!-- Mobile hamburger -->
    <button class="hamburger" id="hamburgerBtn">☰</button>

    <!-- Mobile overlay sidebar -->
    <div class="overlay" id="overlay"></div>
    <div class="sidebar-mobile" id="mobileSidebar">
        <button class="close-btn" id="closeSidebarBtn">✕</button>
        <h2>🚗 Route Risk</h2>
        <div class="status-bar" id="statusMobile">💡 Type or click map to set START</div>
        <div class="form-group"><label>📍 START</label><input type="text" id="startMobile" placeholder="e.g., Connaught Place, Delhi" autocomplete="off"><button onclick="searchAddressMobile('start')" class="search-btn">🔍 Search Start</button></div>
        <div class="form-group"><label>🏁 DESTINATION</label><input type="text" id="endMobile" placeholder="e.g., Marine Drive, Mumbai" autocomplete="off"><button onclick="searchAddressMobile('end')" class="search-btn">🔍 Search Destination</button></div>
        <div class="form-group"><label>📧 Email</label><input type="email" id="emailMobile" placeholder="you@example.com"></div>
        <div class="form-group"><label>🚗 Vehicle</label><select id="vehicleMobile"><option>Car</option><option>Motorcycle</option><option>Truck</option></select></div>
        <div class="form-group"><label>⏰ Time</label><select id="timeMobile"><option>Morning</option><option>Afternoon</option><option>Evening</option><option>Night</option></select></div>
        <div class="form-group"><label>🌤️ Weather</label><select id="weatherMobile"><option>Clear</option><option>Rain</option><option>Fog</option><option>Snow</option></select></div>
        <button onclick="getUserLocationMobile()" style="background:#10b981;">📍 My Live Location</button>
        <button onclick="calculateRouteMobile()">🔍 Calculate Route & Risk</button>
        <div id="journeyControlsMobile" class="journey-controls" style="display:none;"><button id="startJourneyMobile">▶️ Start</button><button id="pauseJourneyMobile">⏸️ Pause</button><button id="resetJourneyMobile">🔄 Reset</button></div>
        <div class="voice-controls"><button onclick="voiceOnMobile()" class="voice-on">🔊 ON</button><button onclick="voiceOffMobile()" class="voice-off">🔇 OFF</button><button onclick="voicePauseMobile()" class="voice-pause">⏸️ Pause</button></div>
        <button onclick="speakNowMobile()" style="background:#3b82f6;">🎤 Speak risk</button>
        <button onclick="clearAllMobile()" style="background:#475569;">🗑️ Clear</button>
        <div id="riskCardMobile" class="risk-card"></div>
        <div id="weatherCardMobile" class="weather-card"></div>
    </div>

    <div class="map-container"><div id="map"></div></div>
</div>

<script>
    // ---------- GLOBALS ----------
    let map, routeLayer, heatLayer, startMarker, endMarker;
    let selectingStart = true;
    let currentRouteData = null;
    let voiceEnabled = true;
    let currentUtterance = null;
    let movingMarker = null;
    let currentLatLngs = null;

    const HOTSPOTS = [
        [28.6139,77.2090,0.95],[28.6300,77.2200,0.92],[28.5600,77.3200,0.88],
        [19.0760,72.8777,0.90],[19.1000,72.8500,0.85],[12.9716,77.5946,0.82],
        [22.5726,88.3639,0.80],[28.5000,77.3000,0.65],[28.4000,77.2000,0.60],
        [13.0827,80.2707,0.58],[17.3850,78.4867,0.55],[26.9124,75.7873,0.52],
        [26.8000,78.0000,0.20],[21.0000,75.0000,0.15],[18.0000,76.0000,0.12]
    ];

    // ---------- HELPER: geocode ----------
    async function geocodeAddress(addr) {
        if (!addr) return null;
        const res = await fetch('/geocode', {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({address:addr})
        });
        const data = await res.json();
        if (data.error) return null;
        return {lat:data.lat, lon:data.lon};
    }

    // ---------- SHARED: set marker (updates both desktop & mobile inputs) ----------
    function setMarker(type, lat, lng, label) {
        const oldMarker = (type === 'start') ? startMarker : endMarker;
        if (oldMarker) map.removeLayer(oldMarker);
        const newMarker = L.marker([lat, lng]).addTo(map);
        newMarker.bindPopup(type === 'start' ? '📍 Start' : '🏁 Destination').openPopup();
        if (type === 'start') {
            startMarker = newMarker;
            document.getElementById('start').value = label;
            if (document.getElementById('startMobile')) document.getElementById('startMobile').value = label;
            selectingStart = false;
        } else {
            endMarker = newMarker;
            document.getElementById('end').value = label;
            if (document.getElementById('endMobile')) document.getElementById('endMobile').value = label;
            selectingStart = true;
        }
    }

    // ---------- SHARED: route calculation ----------
    async function performRouteCalculation(start, end, vehicle, timeOfDay, weatherCond, email, isMobile) {
        if (!start || !end) { alert("Set both start and destination"); return false; }
        const payload = { start, end, vehicle, time: timeOfDay, weather: weatherCond, email };
        try {
            const resp = await fetch('/api/route', {
                method:'POST',
                headers:{'Content-Type':'application/json'},
                body:JSON.stringify(payload)
            });
            const data = await resp.json();
            if (data.error) throw new Error(data.error);
            const route = data.route, risk = data.risk;
            currentRouteData = { distance: route.distance_km, duration: route.duration_min, risk };
            if (routeLayer) map.removeLayer(routeLayer);
            routeLayer = L.polyline(route.points, { color:'#2563eb', weight:5 }).addTo(map);
            map.fitBounds(routeLayer.getBounds());
            addHeatmap();
            currentLatLngs = route.points.map(p => L.latLng(p[0], p[1]));
            if (movingMarker) movingMarker.remove();
            const journeyDiv = isMobile ? document.getElementById('journeyControlsMobile') : document.getElementById('journeyControls');
            if (journeyDiv) journeyDiv.style.display = 'flex';
            setupJourneyButtons(isMobile);
            // Update UI
            const riskCard = isMobile ? document.getElementById('riskCardMobile') : document.getElementById('riskCard');
            const weatherCard = isMobile ? document.getElementById('weatherCardMobile') : document.getElementById('weatherCard');
            if (riskCard) {
                riskCard.style.display = 'block';
                riskCard.innerHTML = `
                    <div class="risk-level risk-${risk.level}">${risk.level} RISK (${risk.score}/100)</div>
                    <div class="route-info">📍 ${route.distance_km.toFixed(0)} km &nbsp;| ⏱️ ${route.duration_min.toFixed(0)} min<br>🚦 Delay: ${route.traffic_delay_min.toFixed(0)} min</div>
                    <div><strong>⚠️ Risk factors</strong><ul>${risk.factors.map(f => `<li>${f}</li>`).join('')}</ul></div>
                    ${data.email_sent ? '<div style="color:green;">✅ Email sent</div>' : ''}
                `;
            }
            if (data.weather_start && data.weather_end && weatherCard) {
                weatherCard.style.display = 'block';
                weatherCard.innerHTML = `<strong>🌤️ Live Weather</strong><br>Start: ${data.weather_start.desc}, ${data.weather_start.temp}°C<br>Dest: ${data.weather_end.desc}, ${data.weather_end.temp}°C`;
            }
            if (voiceEnabled) {
                let msg = `${risk.level} risk. ${route.distance_km.toFixed(0)} km, ${route.duration_min.toFixed(0)} min.`;
                if (risk.level === 'HIGH') msg = "Warning! " + msg;
                speakMessage(msg);
            }
            // Save history
            let history = JSON.parse(localStorage.getItem('tripHistory') || '[]');
            history.unshift({ id:Date.now(), start, end, risk:risk.level, score:risk.score, distance:route.distance_km.toFixed(0), duration:route.duration_min.toFixed(0), date:new Date().toLocaleString() });
            if (history.length > 20) history.pop();
            localStorage.setItem('tripHistory', JSON.stringify(history));
            return true;
        } catch (err) {
            alert("Error: " + err.message);
            return false;
        }
    }

    // ---------- DESKTOP functions ----------
    async function searchAddressDesktop(type) {
        const addr = document.getElementById(type).value.trim();
        if (!addr) { alert("Enter address"); return; }
        const coords = await geocodeAddress(addr);
        if (coords) setMarker(type, coords.lat, coords.lon, addr);
        else alert("Address not found");
    }
    function getUserLocationDesktop() {
        if (!navigator.geolocation) { alert("Not supported"); return; }
        navigator.geolocation.getCurrentPosition(pos => {
            setMarker('start', pos.coords.latitude, pos.coords.longitude, `${pos.coords.latitude.toFixed(6)}, ${pos.coords.longitude.toFixed(6)}`);
            map.setView([pos.coords.latitude, pos.coords.longitude], 12);
        }, () => alert("Location denied"));
    }
    function calculateRouteDesktop() {
        const start = document.getElementById('start').value;
        const end = document.getElementById('end').value;
        const vehicle = document.getElementById('vehicle').value;
        const time = document.getElementById('time').value;
        const weather = document.getElementById('weather').value;
        const email = document.getElementById('email').value;
        performRouteCalculation(start,end,vehicle,time,weather,email, false);
    }
    function clearAllDesktop() { clearAll(); }
    function showHistoryDesktop() { showHistory(); }
    function clearHistoryDesktop() { clearHistory(); }
    function voiceOnDesktop() { voiceOn(); }
    function voiceOffDesktop() { voiceOff(); }
    function voicePauseDesktop() { voicePause(); }
    function speakNowDesktop() { speakNow(); }

    // ---------- MOBILE functions (same core) ----------
    async function searchAddressMobile(type) {
        const inputId = (type === 'start') ? 'startMobile' : 'endMobile';
        const addr = document.getElementById(inputId).value.trim();
        if (!addr) { alert("Enter address"); return; }
        const coords = await geocodeAddress(addr);
        if (coords) setMarker(type, coords.lat, coords.lon, addr);
        else alert("Address not found");
    }
    function getUserLocationMobile() { getUserLocationDesktop(); } // reuses same logic
    function calculateRouteMobile() {
        const start = document.getElementById('startMobile').value;
        const end = document.getElementById('endMobile').value;
        const vehicle = document.getElementById('vehicleMobile').value;
        const time = document.getElementById('timeMobile').value;
        const weather = document.getElementById('weatherMobile').value;
        const email = document.getElementById('emailMobile').value;
        performRouteCalculation(start,end,vehicle,time,weather,email, true);
    }
    function voiceOnMobile() { voiceOn(); }
    function voiceOffMobile() { voiceOff(); }
    function voicePauseMobile() { voicePause(); }
    function speakNowMobile() { speakNow(); }
    function clearAllMobile() { clearAll(); }

    // ---------- Voice & helpers ----------
    function speakMessage(msg) {
        if (!voiceEnabled) return;
        if (currentUtterance) window.speechSynthesis.cancel();
        currentUtterance = new SpeechSynthesisUtterance(msg);
        currentUtterance.rate = 0.9;
        window.speechSynthesis.speak(currentUtterance);
    }
    function voiceOn() { voiceEnabled = true; speakMessage("Voice on"); }
    function voiceOff() { voiceEnabled = false; if (currentUtterance) window.speechSynthesis.cancel(); }
    function voicePause() { if (window.speechSynthesis.speaking) window.speechSynthesis.cancel(); }
    function speakNow() {
        if (!currentRouteData) speakMessage("Calculate a route first.");
        else speakMessage(`${currentRouteData.risk.level} risk. ${currentRouteData.distance.toFixed(0)} km, ${currentRouteData.duration.toFixed(0)} min.`);
    }

    function setupJourneyButtons(isMobile) {
        const startId = isMobile ? 'startJourneyMobile' : 'startJourneyBtn';
        const pauseId = isMobile ? 'pauseJourneyMobile' : 'pauseJourneyBtn';
        const resetId = isMobile ? 'resetJourneyMobile' : 'resetJourneyBtn';
        const startBtn = document.getElementById(startId);
        const pauseBtn = document.getElementById(pauseId);
        const resetBtn = document.getElementById(resetId);
        if (!startBtn) return;
        const newStart = startBtn.cloneNode(true);
        const newPause = pauseBtn.cloneNode(true);
        const newReset = resetBtn.cloneNode(true);
        startBtn.parentNode.replaceChild(newStart, startBtn);
        pauseBtn.parentNode.replaceChild(newPause, pauseBtn);
        resetBtn.parentNode.replaceChild(newReset, resetBtn);
        newStart.onclick = () => {
            if (!currentLatLngs) return;
            if (movingMarker) movingMarker.remove();
            const icon = L.divIcon({ html:'<div style="background:#1e3a8a;width:24px;height:24px;border-radius:50%;border:3px solid white;"></div>', iconSize:[24,24] });
            movingMarker = L.markerMotion(currentLatLngs, 50, { icon, rotation:true, autoplay:true, loop:false }).addTo(map);
            movingMarker.on('end', () => speakMessage("You have arrived."));
        };
        newPause.onclick = () => movingMarker && movingMarker.pause();
        newReset.onclick = () => movingMarker && movingMarker.reset();
    }

    function clearAll() {
        if (startMarker) map.removeLayer(startMarker);
        if (endMarker) map.removeLayer(endMarker);
        if (routeLayer) map.removeLayer(routeLayer);
        if (movingMarker) movingMarker.remove();
        startMarker = endMarker = routeLayer = movingMarker = null;
        selectingStart = true;
        currentRouteData = null;
        currentLatLngs = null;
        document.getElementById('start').value = '';
        document.getElementById('end').value = '';
        if (document.getElementById('startMobile')) document.getElementById('startMobile').value = '';
        if (document.getElementById('endMobile')) document.getElementById('endMobile').value = '';
        const riskCards = ['riskCard','riskCardMobile'];
        riskCards.forEach(id => { let el = document.getElementById(id); if (el) el.style.display = 'none'; });
        const weatherCards = ['weatherCard','weatherCardMobile'];
        weatherCards.forEach(id => { let el = document.getElementById(id); if (el) el.style.display = 'none'; });
        const historyPanel = document.getElementById('historyPanel');
        if (historyPanel) historyPanel.style.display = 'none';
        const journeyDivs = ['journeyControls','journeyControlsMobile'];
        journeyDivs.forEach(id => { let el = document.getElementById(id); if (el) el.style.display = 'none'; });
        const statusDiv = document.getElementById('status');
        if (statusDiv) statusDiv.innerHTML = '💡 Type or click map to set START';
        const statusMobile = document.getElementById('statusMobile');
        if (statusMobile) statusMobile.innerHTML = '💡 Type or click map to set START';
        map.setView([20.5937,78.9629],5);
        addHeatmap();
    }

    function showHistory() {
        const panel = document.getElementById('historyPanel');
        const list = document.getElementById('historyList');
        let history = JSON.parse(localStorage.getItem('tripHistory') || '[]');
        list.innerHTML = history.length ? history.map(t => `<div class="history-item" onclick="restoreTrip('${t.start.replace(/'/g,"\\'")}', '${t.end.replace(/'/g,"\\'")}')"><strong>${t.start} → ${t.end}</strong><br>Risk: ${t.risk} (${t.score}/100) | ${t.distance} km | ${t.duration} min<br><small>${t.date}</small></div>`).join('') : "<i>No trips saved</i>";
        panel.style.display = 'block';
    }
    function restoreTrip(start,end) {
        document.getElementById('start').value = start;
        document.getElementById('end').value = end;
        if (document.getElementById('startMobile')) document.getElementById('startMobile').value = start;
        if (document.getElementById('endMobile')) document.getElementById('endMobile').value = end;
        document.getElementById('historyPanel').style.display = 'none';
        calculateRouteDesktop();
    }
    function clearHistory() {
        if (confirm("Delete all history?")) {
            localStorage.removeItem('tripHistory');
            const list = document.getElementById('historyList');
            if (list) list.innerHTML = '';
            const panel = document.getElementById('historyPanel');
            if (panel) panel.style.display = 'none';
        }
    }

    function addHeatmap() {
        if (heatLayer) map.removeLayer(heatLayer);
        heatLayer = L.heatLayer(HOTSPOTS, { radius:38, blur:22, maxZoom:12, minOpacity:0.35, gradient:{0.2:'#00cc44',0.5:'#ffaa00',0.9:'#ff0000'} }).addTo(map);
    }

    function initMap() {
        map = L.map('map', { zoomControl:false, attributionControl:false }).setView([20.5937,78.9629],5);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { attribution:'' }).addTo(map);
        map.on('click', function(e) {
            const lat = e.latlng.lat, lng = e.latlng.lng;
            const coord = `${lat.toFixed(6)}, ${lng.toFixed(6)}`;
            if (selectingStart) setMarker('start', lat, lng, coord);
            else setMarker('end', lat, lng, coord);
            selectingStart = !selectingStart;
        });
        addHeatmap();
        setupAutocomplete();
    }

    function setupAutocomplete() {
        let timeout;
        const attach = (inputId) => {
            const input = document.getElementById(inputId);
            if (!input) return;
            input.addEventListener('input', function() {
                const q = this.value.trim();
                if (q.length < 2) return;
                if (timeout) clearTimeout(timeout);
                timeout = setTimeout(async () => {
                    try {
                        const res = await fetch(`/autocomplete?query=${encodeURIComponent(q)}`);
                        const sug = await res.json();
                        if (!sug.length) return;
                        const datalistId = `${inputId}-datalist`;
                        let dl = document.getElementById(datalistId);
                        if (!dl) {
                            dl = document.createElement('datalist');
                            dl.id = datalistId;
                            input.setAttribute('list', datalistId);
                            input.parentNode.appendChild(dl);
                        }
                        dl.innerHTML = sug.map(s => `<option value="${s.display.replace(/"/g,'&quot;')}">`).join('');
                    } catch(e) { console.error(e); }
                }, 300);
            });
        };
        attach('start');
        attach('end');
        attach('startMobile');
        attach('endMobile');
    }

    // Hamburger menu
    document.getElementById('hamburgerBtn')?.addEventListener('click', () => {
        document.getElementById('mobileSidebar').classList.add('open');
        document.getElementById('overlay').style.display = 'block';
    });
    document.getElementById('closeSidebarBtn')?.addEventListener('click', () => {
        document.getElementById('mobileSidebar').classList.remove('open');
        document.getElementById('overlay').style.display = 'none';
    });
    document.getElementById('overlay')?.addEventListener('click', () => {
        document.getElementById('mobileSidebar').classList.remove('open');
        document.getElementById('overlay').style.display = 'none';
    });

    window.addEventListener('load', initMap);
</script>
</body>
</html>
