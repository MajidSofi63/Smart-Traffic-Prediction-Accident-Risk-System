<!DOCTYPE html>
<html>
<head>
    <title>Traffic Risk Predictor</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { margin: 0; font-family: Arial; }
        .container { display: flex; height: 100vh; }
        .sidebar { width: 320px; background: white; padding: 20px; overflow-y: auto; }
        .map-container { flex: 1; }
        #map { height: 100%; }
        input, select { width: 100%; padding: 8px; margin: 5px 0 15px; border: 1px solid #ddd; border-radius: 5px; }
        button { width: 100%; padding: 10px; background: #667eea; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
        .risk-card { margin-top: 20px; padding: 15px; background: #f5f5f5; border-radius: 10px; display: none; }
        .risk-low { background: #4CAF50; color: white; padding: 10px; text-align: center; border-radius: 5px; }
        .risk-medium { background: #ff9800; color: white; padding: 10px; text-align: center; border-radius: 5px; }
        .risk-high { background: #f44336; color: white; padding: 10px; text-align: center; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h2>🚗 Trip Risk Predictor</h2>
            <input type="text" id="start" placeholder="Start" value="New Delhi">
            <input type="text" id="end" placeholder="Destination" value="Mumbai">
            <input type="email" id="email" placeholder="Email for alerts (optional)">
            
            <select id="vehicle">
                <option value="Car">Car</option>
                <option value="Motorcycle">Motorcycle</option>
                <option value="Truck">Truck</option>
            </select>
            
            <select id="time">
                <option value="Morning">Morning</option>
                <option value="Afternoon">Afternoon</option>
                <option value="Evening">Evening</option>
                <option value="Night">Night</option>
            </select>
            
            <select id="weather">
                <option value="Clear">Clear</option>
                <option value="Rain">Rain</option>
                <option value="Fog">Fog</option>
            </select>
            
            <button onclick="getRoute()">🔍 Calculate Risk</button>
            
            <div id="result" class="risk-card"></div>
        </div>
        <div class="map-container">
            <div id="map"></div>
        </div>
    </div>

    <script>
        let map, routeLine;
        
        function initMap() {
            map = L.map('map').setView([20.5937, 78.9629], 5);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        }
        
        async function getRoute() {
            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = '<p>🔄 Calculating...</p>';
            
            try {
                const response = await fetch('/api/route', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        start: document.getElementById('start').value,
                        end: document.getElementById('end').value,
                        vehicle: document.getElementById('vehicle').value,
                        time: document.getElementById('time').value,
                        weather: document.getElementById('weather').value,
                        email: document.getElementById('email').value
                    })
                });
                
                const data = await response.json();
                
                if (data.error) {
                    resultDiv.innerHTML = `<p style="color:red">Error: ${data.error}</p>`;
                    return;
                }
                
                const route = data.route;
                const risk = route.risk;
                
                // Draw route on map
                if (routeLine) map.removeLayer(routeLine);
                routeLine = L.polyline(route.points, { color: '#2196F3', weight: 5 }).addTo(map);
                map.fitBounds(routeLine.getBounds());
                
                // Show results
                resultDiv.innerHTML = `
                    <div class="risk-${risk.level.toLowerCase()}">
                        <strong>${risk.level} RISK</strong><br>
                        ${risk.severity} Accident (${risk.confidence}% confidence)
                    </div>
                    <div style="margin-top: 15px">
                        📍 ${route.distance_km.toFixed(0)} km<br>
                        ⏱️ ${route.duration_min.toFixed(0)} minutes<br>
                        🚦 Traffic delay: ${route.traffic_delay_min.toFixed(0)} min
                    </div>
                    <div style="margin-top: 10px">
                        <strong>⚠️ Risk Factors:</strong><br>
                        ${risk.factors.map(f => `• ${f}`).join('<br>')}
                    </div>
                    ${data.email_sent ? '<p style="color:green; margin-top:10px">✅ Email sent!</p>' : ''}
                `;
                
                // Voice alert
                const msg = `${risk.level} risk route. ${risk.severity} accident possible. ${route.distance_km.toFixed(0)} kilometers. ${route.duration_min.toFixed(0)} minutes.`;
                const utterance = new SpeechSynthesisUtterance(msg);
                utterance.rate = 0.9;
                speechSynthesis.cancel();
                speechSynthesis.speak(utterance);
                
            } catch (error) {
                resultDiv.innerHTML = `<p style="color:red">Error: ${error.message}</p>`;
            }
        }
        
        window.addEventListener('load', initMap);
    </script>
</body>
</html>
