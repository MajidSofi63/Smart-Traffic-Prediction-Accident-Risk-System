<!DOCTYPE html>
<html>
<head>
    <title>Route Risk Predictor – Live Traffic & Weather</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <!-- Leaflet core + heatmap -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.heat/0.2.0/leaflet-heat.js"></script>
    <!-- MarkerMotion plugin for moving marker -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.marker-motion@0.7.0/leaflet.marker-motion.css" />
    <script src="https://cdn.jsdelivr.net/npm/leaflet.marker-motion@0.7.0/leaflet.marker-motion.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #000;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            position: fixed;
        }
        /* Map container - full screen */
        .map-container {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 1;
        }
        #map {
            height: 100%;
            width: 100%;
        }
        /* Top search bar (like Google Maps) */
        .search-container {
            position: absolute;
            top: 16px;
            left: 12px;
            right: 12px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }
        .search-card {
            background: white;
            border-radius: 28px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            pointer-events: auto;
            backdrop-filter: blur(0);
            transition: all 0.2s;
        }
        .search-row {
            display: flex;
            align-items: center;
            padding: 8px 16px;
            gap: 12px;
            border-bottom: 1px solid #f0f0f0;
        }
        .search-row:last-child {
            border-bottom: none;
        }
        .search-icon {
            color: #667eea;
            font-size: 18px;
            font-weight: 500;
            min-width: 24px;
        }
        .search-input {
            flex: 1;
            border: none;
            font-size: 16px;
            padding: 12px 0;
            background: transparent;
            outline: none;
            font-weight: 500;
        }
        .search-input::placeholder {
            color: #8e8e93;
            font-weight: 400;
        }
        .search-actions {
            display: flex;
            gap: 8px;
            margin-left: auto;
        }
        .search-action-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            padding: 6px;
            border-radius: 30px;
            width: auto;
            color: #667eea;
        }
        /* Bottom sheet (mobile) */
        .bottom-sheet {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            border-radius: 24px 24px 0 0;
            box-shadow: 0 -2px 20px rgba(0,0,0,0.1);
            z-index: 20;
            max-height: 70vh;
            transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            transform: translateY(calc(100% - 70px));
            overflow-y: auto;
            touch-action: pan-y;
        }
        .bottom-sheet.expanded {
            transform: translateY(0);
        }
        .sheet-handle {
            width: 40px;
            height: 5px;
            background: #c0c0c0;
            border-radius: 10px;
            margin: 12px auto;
            cursor: pointer;
        }
        .sheet-content {
            padding: 8px 16px 24px;
        }
        /* Desktop: show sidebar instead of bottom sheet */
        @media (min-width: 768px) {
            .search-container {
                left: 380px;
                right: 20px;
                top: 20px;
            }
            .bottom-sheet {
                display: none;
            }
            .desktop-sidebar {
                display: block;
                position: absolute;
                left: 0;
                top: 0;
                bottom: 0;
                width: 360px;
                background: white;
                z-index: 15;
                overflow-y: auto;
                box-shadow: 2px 0 12px rgba(0,0,0,0.1);
                border-radius: 0;
            }
        }
        @media (max-width: 767px) {
            .desktop-sidebar {
                display: none;
            }
        }
        /* Desktop sidebar content (same as before but inside) */
        .desktop-sidebar {
            display: none;
            padding: 20px;
            background: white;
        }
        .desktop-sidebar h2 {
            color: #1e3a8a;
            margin-bottom: 16px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            font-weight: 600;
            font-size: 13px;
            color: #334155;
            display: block;
            margin-bottom: 4px;
        }
        select, .desktop-sidebar input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            font-size: 14px;
        }
        .desktop-sidebar button {
            width: 100%;
            padding: 10px;
            background: #1e3a8a;
            border: none;
            border-radius: 40px;
            color: white;
            font-weight: bold;
            margin-top: 8px;
            cursor: pointer;
        }
        /* Bottom sheet form elements */
        .bottom-sheet .form-group {
            margin-bottom: 14px;
        }
        .bottom-sheet input, .bottom-sheet select {
            width: 100%;
            padding: 10px;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            font-size: 15px;
            background: #f8fafc;
        }
        .bottom-sheet button {
            background: #1e3a8a;
            border: none;
            color: white;
            font-weight: 600;
            padding: 12px;
            border-radius: 40px;
            width: 100%;
            margin-top: 8px;
        }
        .risk-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: bold;
        }
        .legend {
            position: absolute;
            bottom: 80px;
            right: 12px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            color: white;
            padding: 6px 12px;
            border-radius: 24px;
            font-size: 11px;
            z-index: 10;
            pointer-events: none;
        }
        .legend-color {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 2px;
            margin-right: 4px;
        }
        .journey-controls {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }
        .voice-row {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="map-container">
        <div id="map"></div>
    </div>

    <!-- Search bar (top) - both mobile and desktop -->
    <div class="search-container">
        <div class="search-card">
            <div class="search-row">
                <span class="search-icon">📍</span>
                <input type="text" id="start" class="search-input" placeholder="Choose start point" autocomplete="off">
                <div class="search-actions">
                    <button class="search-action-btn" onclick="searchAddress('start')">🔍</button>
                </div>
            </div>
            <div class="search-row">
                <span class="search-icon">🏁</span>
                <input type="text" id="end" class="search-input" placeholder="Choose destination" autocomplete="off">
                <div class="search-actions">
                    <button class="search-action-btn" onclick="searchAddress('end')">🔍</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Mobile Bottom Sheet -->
    <div class="bottom-sheet" id="bottomSheet">
        <div class="sheet-handle" id="sheetHandle"></div>
        <div class="sheet-content" id="sheetContent">
            <div class="form-group">
                <label>🚗 Vehicle</label>
                <select id="vehicle_mobile">
                    <option>Car</option><option>Motorcycle</option><option>Truck</option>
                </select>
            </div>
            <div class="form-group">
                <label>⏰ Time</label>
                <select id="time_mobile">
                    <option>Morning</option><option>Afternoon</option><option>Evening</option><option>Night</option>
                </select>
            </div>
            <div class="form-group">
                <label>🌤️ Weather</label>
                <select id="weather_mobile">
                    <option>Clear</option><option>Rain</option><option>Fog</option><option>Snow</option>
                </select>
            </div>
            <button id="calculateBtnMobile">🔍 Calculate Route & Risk</button>
            <button id="locateBtnMobile" style="background:#10b981;">📍 My Location</button>
            <div class="voice-row">
                <button id="voiceOnMobile" style="background:#15803d;">🔊 ON</button>
                <button id="voiceOffMobile" style="background:#b91c1c;">🔇 OFF</button>
                <button id="voicePauseMobile" style="background:#d97706;">⏸️ Pause</button>
            </div>
            <div id="riskCardMobile" style="display:none; margin-top:16px; background:#f1f5f9; border-radius:20px; padding:12px;"></div>
            <div id="weatherCardMobile" style="display:none; margin-top:12px;"></div>
            <div class="journey-controls" id="journeyControlsMobile" style="display:none;">
                <button id="startJourneyMobile">▶️ Start</button>
                <button id="pauseJourneyMobile">⏸️ Pause</button>
                <button id="resetJourneyMobile">🔄 Reset</button>
            </div>
        </div>
    </div>

    <!-- Desktop Sidebar (visible on >768px) -->
    <div class="desktop-sidebar" id="desktopSidebar">
        <h2>🚗 Route Risk Predictor</h2>
        <div class="form-group">
            <label>🚗 Vehicle</label>
            <select id="vehicle_desktop">
                <option>Car</option><option>Motorcycle</option><option>Truck</option>
            </select>
        </div>
        <div class="form-group">
            <label>⏰ Time of day</label>
            <select id="time_desktop">
                <option>Morning</option><option>Afternoon</option><option>Evening</option><option>Night</option>
            </select>
        </div>
        <div class="form-group">
            <label>🌤️ Weather</label>
            <select id="weather_desktop">
                <option>Clear</option><option>Rain</option><option>Fog</option><option>Snow</option>
            </select>
        </div>
        <div class="form-group">
            <label>📧 Email alerts</label>
            <input type="email" id="email_desktop" placeholder="you@example.com">
        </div>
        <button id="calculateBtnDesktop">🔍 Calculate Route & Risk</button>
        <button id="locateBtnDesktop" style="background:#10b981;">📍 My Location</button>
        <div class="voice-controls" style="display:flex; gap:8px; margin-top:8px;">
            <button id="voiceOnDesktop" style="background:#15803d;">🔊 ON</button>
            <button id="voiceOffDesktop" style="background:#b91c1c;">🔇 OFF</button>
            <button id="voicePauseDesktop" style="background:#d97706;">⏸️ Pause</button>
        </div>
        <div id="riskCardDesktop" style="display:none; margin-top:16px;"></div>
        <div id="weatherCardDesktop" style="display:none;"></div>
        <div class="journey-controls" id="journeyControlsDesktop" style="display:none;">
            <button id="startJourneyDesktop">▶️ Start</button>
            <button id="pauseJourneyDesktop">⏸️ Pause</button>
            <button id="resetJourneyDesktop">🔄 Reset</button>
        </div>
    </div>

    <div class="legend">
        <span class="legend-color" style="background:#ff0000;"></span> High
        <span class="legend-color" style="background:#ffaa00;"></span> Med
        <span class="legend-color" style="background:#00cc44;"></span> Low
    </div>

    <script>
        // ------------------- GLOBALS -------------------
        let map, routeLayer, heatLayer, startMarker, endMarker;
        let selectingStart = true;
        let currentRouteData = null;
        let voiceEnabled = true;
        let currentUtterance = null;
        let movingMarker = null;
        let currentLatLngs = null;

        const HOTSPOTS = [
            [28.6139,77.2090,0.95],[28.6300,77.2200,0.92],[28.5600,77.3200,0.88],
            [19.0760,72.8777,0.90],[19.1000,72.8500,0.85],[12.9716,77.5946,0.82],
            [22.5726,88.3639,0.80],[28.5000,77.3000,0.65],[28.4000,77.2000,0.60],
            [13.0827,80.2707,0.58],[17.3850,78.4867,0.55],[26.9124,75.7873,0.52],
            [26.8000,78.0000,0.20],[21.0000,75.0000,0.15],[18.0000,76.0000,0.12]
        ];

        function initMap() {
            map = L.map('map').setView([20.5937,78.9629],5);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{
                attribution:'© OpenStreetMap | TomTom traffic'
            }).addTo(map);
            map.on('click',function(e){
                const lat=e.latlng.lat,lng=e.latlng.lng;
                const coord=`${lat.toFixed(6)}, ${lng.toFixed(6)}`;
                if(selectingStart){
                    setMarker('start',lat,lng,coord);
                    document.getElementById('start').value=coord;
                    selectingStart=false;
                } else {
                    setMarker('end',lat,lng,coord);
                    document.getElementById('end').value=coord;
                    selectingStart=true;
                }
            });
            addHeatmap();
            setupAutocomplete();
            // bottom sheet drag
            const sheet=document.getElementById('bottomSheet');
            const handle=document.getElementById('sheetHandle');
            let startY=0, startTransform=0;
            handle.addEventListener('touchstart',(e)=>{
                startY=e.touches[0].clientY;
                startTransform=sheet.getBoundingClientRect().top;
            });
            handle.addEventListener('touchmove',(e)=>{
                const delta=e.touches[0].clientY-startY;
                if(delta<0) sheet.style.transform=`translateY(${Math.max(-300,delta)}px)`;
                else if(delta>0) sheet.style.transform=`translateY(${Math.min(100,delta)}px)`;
            });
            handle.addEventListener('touchend',()=>{
                const rect=sheet.getBoundingClientRect();
                if(rect.top<window.innerHeight-400) sheet.classList.add('expanded');
                else sheet.classList.remove('expanded');
                sheet.style.transform='';
            });
        }

        function addHeatmap(){
            if(heatLayer) map.removeLayer(heatLayer);
            heatLayer=L.heatLayer(HOTSPOTS,{radius:38,blur:22,maxZoom:12,minOpacity:0.35,
                gradient:{0.2:'#00cc44',0.5:'#ffaa00',0.9:'#ff0000'}}).addTo(map);
        }

        function setMarker(type,lat,lng,label){
            const marker=(type==='start')?startMarker:endMarker;
            if(marker) map.removeLayer(marker);
            const newMarker=L.marker([lat,lng]).addTo(map);
            newMarker.bindPopup(type==='start'?'📍 Start':'🏁 Destination').openPopup();
            if(type==='start'){ startMarker=newMarker; document.getElementById('start').value=label; }
            else { endMarker=newMarker; document.getElementById('end').value=label; }
        }

        async function searchAddress(pointType){
            const addr=document.getElementById(pointType).value.trim();
            if(!addr){ alert("Enter an address"); return; }
            try{
                const resp=await fetch('/geocode',{
                    method:'POST',headers:{'Content-Type':'application/json'},
                    body:JSON.stringify({address:addr})
                });
                const data=await resp.json();
                if(data.error) throw new Error(data.error);
                setMarker(pointType,data.lat,data.lon,addr);
                if(pointType==='start') selectingStart=false;
                else selectingStart=true;
            } catch(err){ alert("Address not found"); }
        }

        function setupAutocomplete(){
            const startInput=document.getElementById('start');
            const endInput=document.getElementById('end');
            let timeout;
            const attach=(input,pointType)=>{
                input.addEventListener('input',()=>{
                    const q=input.value.trim();
                    if(q.length<2) return;
                    if(timeout) clearTimeout(timeout);
                    timeout=setTimeout(async()=>{
                        const res=await fetch(`/autocomplete?query=${encodeURIComponent(q)}`);
                        const sug=await res.json();
                        if(!sug.length) return;
                        const datalistId=`${pointType}-list`;
                        let dl=document.getElementById(datalistId);
                        if(!dl){
                            dl=document.createElement('datalist');
                            dl.id=datalistId;
                            input.setAttribute('list',datalistId);
                            input.parentNode.appendChild(dl);
                        }
                        dl.innerHTML=sug.map(s=>`<option value="${s.display.replace(/"/g,'&quot;')}">`).join('');
                    },300);
                });
                input.addEventListener('change',async()=>{
                    const val=input.value;
                    if(!val) return;
                    const res=await fetch('/geocode',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({address:val})});
                    const data=await res.json();
                    if(!data.error) setMarker(pointType,data.lat,data.lon,val);
                });
            };
            attach(startInput,'start');
            attach(endInput,'end');
        }

        async function calculateRoute(start,end,vehicle,time,weather,email,isMobile){
            if(!start||!end){ alert("Set both start and destination"); return; }
            const riskCard=isMobile?document.getElementById('riskCardMobile'):document.getElementById('riskCardDesktop');
            const riskLevelDiv=isMobile?document.getElementById('riskLevelMobile'):document.getElementById('riskLevelDesktop');
            if(riskCard) riskCard.style.display='block';
            if(riskLevelDiv) riskLevelDiv.innerHTML="🔄 Calculating...";
            try{
                const payload={start,end,vehicle,time,weather,email};
                const resp=await fetch('/api/route',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
                const data=await resp.json();
                if(data.error) throw new Error(data.error);
                const route=data.route, risk=data.risk;
                currentRouteData={distance:route.distance_km,duration:route.duration_min,risk};
                if(routeLayer) map.removeLayer(routeLayer);
                routeLayer=L.polyline(route.points,{color:'#2563eb',weight:5}).addTo(map);
                map.fitBounds(routeLayer.getBounds());
                addHeatmap();
                currentLatLngs=route.points.map(p=>L.latLng(p[0],p[1]));
                if(movingMarker) movingMarker.remove();
                const controlsDiv=isMobile?document.getElementById('journeyControlsMobile'):document.getElementById('journeyControlsDesktop');
                if(controlsDiv) controlsDiv.style.display='flex';
                setupJourneyButtons(isMobile);
                const severityHtml=`<div class="risk-level risk-${risk.level}" style="padding:12px;border-radius:40px;text-align:center;margin-bottom:8px;">${risk.level} RISK (${risk.score}/100)</div>`;
                const infoHtml=`<div>📍 ${route.distance_km.toFixed(0)} km &nbsp;| ⏱️ ${route.duration_min.toFixed(0)} min<br>🚦 Delay: ${route.traffic_delay_min.toFixed(0)} min</div>`;
                const factorsHtml=`<strong>⚠️ Risk factors</strong><ul>${risk.factors.map(f=>`<li>${f}</li>`).join('')}</ul>`;
                if(riskCard){
                    riskCard.innerHTML=severityHtml+infoHtml+factorsHtml;
                    if(data.email_sent) riskCard.innerHTML+='<div style="color:green;">✅ Email sent</div>';
                }
                if(data.weather_start && data.weather_end){
                    const weatherDiv=isMobile?document.getElementById('weatherCardMobile'):document.getElementById('weatherCardDesktop');
                    if(weatherDiv){
                        weatherDiv.style.display='block';
                        weatherDiv.innerHTML=`<strong>🌤️ Live weather</strong><br>Start: ${data.weather_start.desc}, ${data.weather_start.temp}°C<br>Dest: ${data.weather_end.desc}, ${data.weather_end.temp}°C`;
                    }
                }
                if(voiceEnabled){
                    let msg=`${risk.level} risk. ${route.distance_km.toFixed(0)} km, ${route.duration_min.toFixed(0)} min.`;
                    if(risk.level==='HIGH') msg="Warning! "+msg;
                    speakMessage(msg);
                }
                // Save history (localStorage)
                let history=JSON.parse(localStorage.getItem('tripHistory')||'[]');
                history.unshift({id:Date.now(),start,end,risk:risk.level,score:risk.score,distance:route.distance_km.toFixed(0),duration:route.duration_min.toFixed(0),date:new Date().toLocaleString()});
                if(history.length>20) history.pop();
                localStorage.setItem('tripHistory',JSON.stringify(history));
            } catch(e){ alert(e.message); }
        }

        function setupJourneyButtons(isMobile){
            const startBtn=document.getElementById(isMobile?'startJourneyMobile':'startJourneyDesktop');
            const pauseBtn=document.getElementById(isMobile?'pauseJourneyMobile':'pauseJourneyDesktop');
            const resetBtn=document.getElementById(isMobile?'resetJourneyMobile':'resetJourneyDesktop');
            if(!startBtn) return;
            const newStart=startBtn.cloneNode(true), newPause=pauseBtn.cloneNode(true), newReset=resetBtn.cloneNode(true);
            startBtn.parentNode.replaceChild(newStart,startBtn);
            pauseBtn.parentNode.replaceChild(newPause,pauseBtn);
            resetBtn.parentNode.replaceChild(newReset,resetBtn);
            newStart.onclick=()=>{
                if(!currentLatLngs) return;
                if(movingMarker) movingMarker.remove();
                const icon=L.divIcon({html:'<div style="background:#1e3a8a;width:24px;height:24px;border-radius:50%;border:3px solid white;"></div>',iconSize:[24,24]});
                movingMarker=L.markerMotion(currentLatLngs,50,{icon,rotation:true,autoplay:true,loop:false}).addTo(map);
                movingMarker.on('end',()=>speakMessage("You have arrived."));
            };
            newPause.onclick=()=>{ if(movingMarker) movingMarker.pause(); };
            newReset.onclick=()=>{ if(movingMarker) movingMarker.reset(); };
        }

        function speakMessage(msg){ if(voiceEnabled && msg){ if(currentUtterance) window.speechSynthesis.cancel(); currentUtterance=new SpeechSynthesisUtterance(msg); currentUtterance.rate=0.9; window.speechSynthesis.speak(currentUtterance); } }
        function setVoice(enabled){ voiceEnabled=enabled; speakMessage(enabled?"Voice on":"Voice off"); }

        // Attach events for both mobile and desktop
        window.addEventListener('load',()=>{
            initMap();
            // Desktop buttons
            document.getElementById('calculateBtnDesktop')?.addEventListener('click',()=>{
                const start=document.getElementById('start').value;
                const end=document.getElementById('end').value;
                const vehicle=document.getElementById('vehicle_desktop').value;
                const time=document.getElementById('time_desktop').value;
                const weather=document.getElementById('weather_desktop').value;
                const email=document.getElementById('email_desktop').value;
                calculateRoute(start,end,vehicle,time,weather,email,false);
            });
            document.getElementById('locateBtnDesktop')?.addEventListener('click',()=>{
                if(navigator.geolocation){
                    navigator.geolocation.getCurrentPosition(pos=>{
                        const {latitude:lat,longitude:lng}=pos.coords;
                        setMarker('start',lat,lng,`${lat.toFixed(6)}, ${lng.toFixed(6)}`);
                        selectingStart=false;
                        map.setView([lat,lng],12);
                    },()=>alert("Location denied"));
                }
            });
            document.getElementById('voiceOnDesktop')?.addEventListener('click',()=>setVoice(true));
            document.getElementById('voiceOffDesktop')?.addEventListener('click',()=>setVoice(false));
            document.getElementById('voicePauseDesktop')?.addEventListener('click',()=>{ if(window.speechSynthesis.speaking) window.speechSynthesis.cancel(); });
            // Mobile buttons
            document.getElementById('calculateBtnMobile')?.addEventListener('click',()=>{
                const start=document.getElementById('start').value;
                const end=document.getElementById('end').value;
                const vehicle=document.getElementById('vehicle_mobile').value;
                const time=document.getElementById('time_mobile').value;
                const weather=document.getElementById('weather_mobile').value;
                calculateRoute(start,end,vehicle,time,weather,'',true);
            });
            document.getElementById('locateBtnMobile')?.addEventListener('click',()=>{
                if(navigator.geolocation){
                    navigator.geolocation.getCurrentPosition(pos=>{
                        const {latitude:lat,longitude:lng}=pos.coords;
                        setMarker('start',lat,lng,`${lat.toFixed(6)}, ${lng.toFixed(6)}`);
                        selectingStart=false;
                        map.setView([lat,lng],12);
                    },()=>alert("Location denied"));
                }
            });
            document.getElementById('voiceOnMobile')?.addEventListener('click',()=>setVoice(true));
            document.getElementById('voiceOffMobile')?.addEventListener('click',()=>setVoice(false));
            document.getElementById('voicePauseMobile')?.addEventListener('click',()=>{ if(window.speechSynthesis.speaking) window.speechSynthesis.cancel(); });
        });
    </script>
</body>
</html>
